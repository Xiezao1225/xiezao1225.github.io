<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PERSONNEL FILE | 神人工业 · 人物档案</title>
    <style>
        :root {
            --bg-color: #020205;
            --accent-blue: #00f2ff;
            --accent-purple: #7000ff;
            --accent-red: #ff003c;
            --accent-green: #00ff88;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(0, 242, 255, 0.2);
            --border-purple: rgba(112, 0, 255, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: #d0e0f0;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', monospace;
            overflow-x: hidden;
        }

        /* 背景网格 */
        .bg-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 242, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.04) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -2;
            pointer-events: none;
        }

        /* 粒子光点 */
        .particle {
            position: fixed;
            width: 2px;
            height: 2px;
            background: var(--accent-blue);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            animation: floatUp linear infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-10vh) scale(1.5);
                opacity: 0;
            }
        }

        /* 顶部扫描线 */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
            z-index: 999;
            pointer-events: none;
            animation: scanDown 4s linear infinite;
            opacity: 0.4;
        }

        @keyframes scanDown {
            0% {
                top: -2px;
            }
            100% {
                top: 100vh;
            }
        }

        /* 导航栏 */
        header {
            width: 100%;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: rgba(2, 2, 5, 0.88);
            backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 900;
            font-size: 1.3rem;
            letter-spacing: 5px;
            color: var(--accent-blue);
            text-shadow: 0 0 22px rgba(0, 242, 255, 0.5);
            text-decoration: none;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border: 2px solid var(--accent-blue);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            background: rgba(0, 242, 255, 0.06);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.25);
        }

        nav {
            display: flex;
            gap: 26px;
        }

        nav a {
            color: #8899aa;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2.5px;
            transition: all 0.3s;
            font-family: monospace;
            position: relative;
        }

        nav a:hover,
        nav a.active {
            color: var(--accent-blue);
            text-shadow: 0 0 10px var(--accent-blue);
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--accent-blue);
            transition: width 0.3s;
        }

        nav a:hover::after,
        nav a.active::after {
            width: 100%;
        }

        /* 主内容 */
        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 50px 30px 80px;
        }

        /* 页面标题 */
        .page-header {
            text-align: center;
            margin-bottom: 55px;
        }

        .page-header .tag {
            display: inline-block;
            padding: 5px 16px;
            border: 1px solid var(--accent-purple);
            color: var(--accent-purple);
            font-family: monospace;
            letter-spacing: 4px;
            font-size: 0.78rem;
            margin-bottom: 16px;
            animation: pulseTag 2s infinite;
        }

        @keyframes pulseTag {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(112, 0, 255, 0.3);
            }
            50% {
                box-shadow: 0 0 22px rgba(112, 0, 255, 0.7);
            }
        }

        .page-header h1 {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 900;
            letter-spacing: 8px;
            background: linear-gradient(180deg, #fff 0%, var(--accent-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .page-header .subtitle {
            color: #556;
            font-family: monospace;
            letter-spacing: 3px;
            font-size: 0.9rem;
        }

        /* 筛选标签 */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 45px;
        }

        .filter-btn {
            padding: 8px 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: transparent;
            color: #889;
            font-family: monospace;
            letter-spacing: 2px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px;
        }

        .filter-btn:hover,
        .filter-btn.active {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            background: rgba(0, 242, 255, 0.06);
            box-shadow: 0 0 16px rgba(0, 242, 255, 0.2);
        }

        /* 人物卡片网格 */
        .personnel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 24px;
        }

        /* 人物卡片 */
        .personnel-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
            position: relative;
        }

        .personnel-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-blue);
            box-shadow: 0 18px 40px rgba(0, 242, 255, 0.15), 0 0 0 1px rgba(0, 242, 255, 0.2) inset;
        }

        .personnel-card.founder {
            border-color: var(--border-purple);
        }

        .personnel-card.founder:hover {
            border-color: var(--accent-purple);
            box-shadow: 0 18px 40px rgba(112, 0, 255, 0.2);
        }

        .card-header {
            padding: 28px 24px 16px;
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 12px;
            border: 2px solid var(--accent-blue);
            background: rgba(0, 242, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar .status-dot {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid var(--bg-color);
        }

        .status-dot.online {
            background: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
        }

        .status-dot.offline {
            background: #555;
        }

        .status-dot.busy {
            background: var(--accent-red);
            box-shadow: 0 0 10px var(--accent-red);
        }

        .card-header .info h3 {
            font-size: 1.2rem;
            letter-spacing: 3px;
            color: #fff;
            margin-bottom: 4px;
        }

        .card-header .info .codename {
            font-family: monospace;
            color: var(--accent-blue);
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        .card-header .info .rank {
            display: inline-block;
            padding: 2px 10px;
            border: 1px solid var(--accent-purple);
            color: var(--accent-purple);
            font-size: 0.7rem;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        .card-body {
            padding: 0 24px 20px;
        }

        .card-body .bio {
            color: #8899aa;
            font-size: 0.88rem;
            line-height: 1.7;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .card-body .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .card-body .tag-item {
            padding: 4px 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            font-size: 0.72rem;
            letter-spacing: 1.5px;
            color: #778;
            transition: all 0.3s;
        }

        .card-body .tag-item:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .card-footer {
            padding: 14px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
            font-size: 0.72rem;
            color: #556;
            letter-spacing: 1.5px;
        }

        .card-footer .clearance {
            color: var(--accent-green);
        }

        .card-footer .clearance.restricted {
            color: var(--accent-red);
        }

        /* 悬停高亮光效 */
        .personnel-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 242, 255, 0.03), transparent);
            transition: left 0.6s;
            pointer-events: none;
        }

        .personnel-card:hover::before {
            left: 100%;
        }

        /* 详情弹窗 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 2, 5, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: rgba(10, 15, 25, 0.95);
            border: 1px solid var(--accent-blue);
            border-radius: 20px;
            padding: 40px;
            max-width: 550px;
            width: 90%;
            box-shadow: 0 0 60px rgba(0, 242, 255, 0.2);
            position: relative;
            animation: modalIn 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes modalIn {
            from {
                transform: scale(0.9) translateY(30px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            border-color: var(--accent-red);
            color: var(--accent-red);
            box-shadow: 0 0 16px rgba(255, 0, 60, 0.4);
        }

        .modal-avatar {
            width: 90px;
            height: 90px;
            border-radius: 14px;
            border: 2px solid var(--accent-blue);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            background: rgba(0, 242, 255, 0.04);
        }

        .modal h2 {
            font-size: 1.8rem;
            letter-spacing: 5px;
            margin-bottom: 6px;
        }

        .modal .modal-codename {
            color: var(--accent-blue);
            font-family: monospace;
            letter-spacing: 3px;
            margin-bottom: 18px;
            font-size: 0.9rem;
        }

        .modal .modal-bio {
            color: #aab;
            line-height: 1.8;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .modal .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-family: monospace;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        .stat-row .stat-label {
            color: #667;
        }

        .stat-row .stat-value {
            color: var(--accent-blue);
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 30px 20px;
            color: #444;
            font-size: 0.8rem;
            letter-spacing: 2.5px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        footer span {
            color: var(--accent-purple);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            header {
                padding: 14px 18px;
                flex-direction: column;
                gap: 12px;
            }
            nav {
                gap: 14px;
                flex-wrap: wrap;
                justify-content: center;
            }
            nav a {
                font-size: 0.72rem;
                letter-spacing: 1.5px;
            }
            .personnel-grid {
                grid-template-columns: 1fr;
            }
            .modal {
                padding: 24px;
            }
        }
    </style>
</head>

            category: 'wanted',
            bio: '【状态更新】目标已复活。原罪名：说我是给、试图在服务器内发动降维打击。悬赏已恢复，目标已回归。',
            tags: ['已复活', '降维打击未遂', '目标回归'],
            clearance: 'RESTRICTED',
            status: 'online',
            avatar: '✨',
            joinDate: '已回归',
            projects: '状态: RESURRECTED · 悬赏已恢复'
        }];

        // ==================== 渲染卡片 ====================
        const grid = document.getElementById('personnelGrid');

        function renderCards(filter = 'all') {
            grid.innerHTML = '';
            const filtered = filter === 'all' ?
                personnelData :
                personnelData.filter(p => p.category === filter);

            filtered.forEach(person => {
                const card = document.createElement('div');
                card.className = `personnel-card ${person.category === 'founder' ? 'founder' : ''} fade-in`;
                card.setAttribute('data-category', person.category);
                card.onclick = () => openModal(person);

                const statusClass = person.status;
                const clearanceClass = person.clearance === 'RESTRICTED' ? 'restricted' : '';

                card.innerHTML = `
                    <div class="card-header">
                        <div class="avatar">
                            <span>${person.avatar}</span>
                            <div class="status-dot ${statusClass}"></div>
                        </div>
                        <div class="info">
                            <h3>${person.name}</h3>
                            <div class="codename">${person.codename}</div>
                            <div class="rank">${person.rank}</div>
                        </div>
                    </div>
                    <div class="card-body">
                        <p class="bio">${person.bio}</p>
                        <div class="tags">
                            ${person.tags.map(t => `<span class="tag-item">${t}</span>`).join('')}
                        </div>
                    </div>
                    <div class="card-footer">
                        <span>CLEARANCE: <span class="clearance ${clearanceClass}">${person.clearance}</span></span>
                        <span>▶ 详情</span>
                    </div>
                `;
                grid.appendChild(card);
            });

            // 触发渐入动画
            requestAnimationFrame(() => {
                document.querySelectorAll('.fade-in').forEach((el, i) => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                });
            });
        }

        // ==================== 筛选功能 ====================
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove(
                    'active'));
                this.classList.add('active');
                const filter = this.getAttribute('data-filter');
                renderCards(filter);
            });
        });

        // ==================== 弹窗详情 ====================
        const modalOverlay = document.getElementById('modalOverlay');
        const modalContent = document.getElementById('modalContent');

        function openModal(person) {
            const statusMap = {
                'online': '🟢 在线',
                'offline': '⚫ 离线',
                'busy': '🔴 忙碌'
            };

            modalContent.innerHTML = `
                <button class="modal-close" onclick="closeModal()">✕</button>
                <div class="modal-avatar">${person.avatar}</div>
                <h2>${person.name}</h2>
                <div class="modal-codename">代号: ${person.codename}</div>
                <p class="modal-bio">${person.bio}</p>
                <div class="stat-row">
                    <span class="stat-label">职级</span>
                    <span class="stat-value">${person.rank}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">状态</span>
                    <span class="stat-value">${statusMap[person.status] || person.status}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">权限等级</span>
                    <span class="stat-value" style="color: ${person.clearance === 'RESTRICTED' ? 'var(--accent-red)' : 'var(--accent-green)'}">${person.clearance}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">加入日期</span>
                    <span class="stat-value">${person.joinDate}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">关联项目</span>
                    <span class="stat-value">${person.projects}</span>
                </div>
                <div style="margin-top:20px; display:flex; flex-wrap:wrap; gap:8px;">
                    ${person.tags.map(t => `<span class="tag-item">${t}</span>`).join('')}
                </div>
            `;
            modalOverlay.classList.add('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // ==================== 初始渲染 ====================
        renderCards();

        // 渐入动画样式补充
        const style = document.createElement('style');
        style.textContent = `
            .fade-in {
                opacity: 0;
                transform: translateY(20px);
                transition: opacity 0.6s ease, transform 0.6s ease;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
