<div class="sr-veil" aria-hidden="true">

    <defs>
      <mask id="srHanMask" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">

      </mask>
    </defs>
    <rect class="sr-veil-cover" width="100" height="100" fill="#050507" mask="url(#srHanMask)"/>
    <text class="sr-veil-white" x="50" y="50" text-anchor="middle" dominant-baseline="central" font-size="34"
          font-weight="900" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif">神</text>
  </svg>
</div>

</header>

      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
